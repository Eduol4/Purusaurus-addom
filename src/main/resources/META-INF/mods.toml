modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''

# ---- Dependencias ----

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Este addon so faz sentido com o Unearthed Journey instalado:
# e dele que vem a entidade Purusaurus que o ovo choca.
[[dependencies.${mod_id}]]
    modId="unearthed_journey"
    mandatory=true
    versionRange="[2.2,)"
    ordering="AFTER"
    side="BOTH"
